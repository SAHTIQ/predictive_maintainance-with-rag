<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/resonex_logo.png" />
    <title>RESONEX · Mission Telemetry & Predictive Maintenance</title>
    <!-- Google Fonts: Inter, JetBrains Mono, Plus Jakarta Sans and Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Tailwind CSS mapped to Clean Industrial Dark Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["'Inter'", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              mono: ["'JetBrains Mono'", "monospace"],
              "mono-telemetry": ["'JetBrains Mono'", "monospace"],
            },
            colors: {
              background: "#0B1220",
              sidebar: "#0F172A",
              card: "#111C2E",
              "card-hover": "#162338",
              border: "#243247",
              "primary-text": "#F1F5F9",
              "secondary-text": "#94A3B8",
              "muted-text": "#64748B",
              accent: "#06B6D4",
              healthy: "#22C55E",
              warning: "#F59E0B",
              critical: "#EF4444",

              // Compatibility aliases mapped to Clean Industrial Dark palette
              "surface-container-lowest": "#0B1220",
              "surface-container-low": "#0F172A",
              "surface-container": "#111C2E",
              "surface-container-high": "#162338",
              "surface-container-highest": "#1E2D44",
              "surface-variant": "#162338",
              surface: "#111C2E",
              "on-background": "#F1F5F9",
              "on-surface": "#F1F5F9",
              "on-surface-variant": "#94A3B8",
              secondary: "#94A3B8",
              outline: "#243247",
              "outline-variant": "#243247",
              primary: "#06B6D4",
              error: "#EF4444",
            },
            borderRadius: {
              DEFAULT: "6px",
              sm: "4px",
              md: "6px",
              lg: "8px",
              xl: "8px",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#0B1220] text-[#F1F5F9] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
