<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/resonex_logo.png" />
    <title>RESONEX · Mission Telemetry & Predictive Maintenance</title>
    <!-- Google Fonts: Inter, JetBrains Mono, Plus Jakarta Sans and Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Tailwind CSS mapped to Clean Industrial Dark Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["'Inter'", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              mono: ["'JetBrains Mono'", "monospace"],
              "mono-telemetry": ["'JetBrains Mono'", "monospace"],
            },
            colors: {
              background: "var(--background)",
              sidebar: "var(--bg-sidebar)",
              card: "var(--bg-card)",
              "card-hover": "var(--bg-card-hover)",
              border: "var(--border-color)",
              "primary-text": "var(--text-primary)",
              "secondary-text": "var(--text-secondary)",
              "muted-text": "var(--text-muted)",
              accent: "var(--accent-blue)",
              healthy: "#22C55E",
              warning: "#F59E0B",
              critical: "#EF4444",

              // Compatibility aliases mapped to design tokens
              "surface-container-lowest": "var(--surface-container-lowest)",
              "surface-container-low": "var(--surface-container-low)",
              "surface-container": "var(--surface-container)",
              "surface-container-high": "var(--surface-container-high)",
              "surface-container-highest": "var(--surface-container-highest)",
              "surface-variant": "var(--surface-variant)",
              surface: "var(--surface)",
              "on-background": "var(--on-background)",
              "on-surface": "var(--on-surface)",
              "on-surface-variant": "var(--on-surface-variant)",
              secondary: "var(--secondary)",
              outline: "var(--outline)",
              "outline-variant": "var(--outline-variant)",
              primary: "var(--primary)",
              error: "var(--error)",
            },
            borderRadius: {
              DEFAULT: "6px",
              sm: "4px",
              md: "6px",
              lg: "8px",
              xl: "8px",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
